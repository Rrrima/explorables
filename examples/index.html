<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable examples</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Barlow, sans-serif; color: #1d1d1f; background: linear-gradient(125deg, #f2f2f2, #f5feff) fixed; line-height: 1.55; }
  a { color: inherit; text-decoration: none; }
  header { max-width: 1040px; margin: 0 auto; padding: 96px 24px 40px; text-align: center; }
  header p { color: #6e6e73; margin: 0 0 10px; font-weight: 500; }
  h1 { font-size: 40px; margin: 0 0 18px; letter-spacing: -0.02em; }
  .lede { max-width: 640px; margin: 0 auto; font-size: 1.2rem; }
  main { max-width: 1040px; margin: 0 auto; padding: 0 24px 80px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
  .cell { padding: 26px; }
  .shot img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; margin-bottom: 16px; }
  .subject { font-size: 13px; color: #6e6e73; margin: 0; }
  h2 { font-size: 1.2rem; margin: 1px 0 6px; }
  .line { font-size: .95rem; color: #3a3a3c; margin: 0 0 14px; }
  .links { display: flex; gap: 18px; font-size: 14px; font-weight: 400; margin: 0; }
  .links a:hover { text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 900px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; padding: 0 16px 64px; } .cell { padding: 22px 4px; } h1 { font-size: 32px; } }
</style></head>
<body>
<header><p>/explorable · examples</p><h1>Explorables</h1><p class="lede">Each one is a researched scrolly essay and a short explainer you can pause and question, made from a style image and a question.</p></header>
<main id="list"></main>
<script>
(async () => {
  const L = await (await fetch("examples.json")).json(), h = location.hostname || "localhost";
  document.getElementById("list").innerHTML = L.map((e) => `
    <article class="cell">
      <a class="shot" href="http://${h}:${e.essayPort}/"><img src="${e.id}/thumb.jpg" alt=""></a>
      <p class="subject">${e.subject} · ${e.style}</p><h2>${e.title}</h2><p class="line">${e.line}</p>
      <p class="links"><a href="http://${h}:${e.essayPort}/">Read the essay</a><a href="http://${h}:${e.videoPort}/">Watch the video</a></p>
    </article>`).join("");
})();
</script>
</body></html>
