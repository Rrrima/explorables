<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky · the explainer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/kit/player.css">
<style>
  /* the notebook: graph paper, ink, a blue pen, a green and a red ink */
  :root {
    --xp-paper: #f5f1e6; --xp-ink: #1d1b18; --xp-ink-2: #4a453e; --xp-muted: #827a6e;
    --xp-accent: #12a15a; --xp-accent-2: #1d1b18;
    --xp-display: "Fraunces", Georgia, serif; --xp-body: "Source Serif 4", Georgia, serif; --xp-mono: "JetBrains Mono", ui-monospace, monospace;
    --xp-line: 1.5px;
  }
  body { margin: 0; color: var(--xp-ink); font-family: var(--xp-body); background-color: var(--xp-paper);
    background-image: linear-gradient(rgba(52,86,140,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(52,86,140,.075) 1px, transparent 1px); background-size: 24px 24px; }
  .page { max-width: 1100px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-left, 0px)) 0; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  header.top h1 { margin: 0; font: italic 900 clamp(34px, 4.4vw, 52px)/1 var(--xp-display); letter-spacing: -0.02em; }
  header.top h1 span { font-style: normal; font-weight: 400; font-size: .5em; color: var(--xp-muted); letter-spacing: 0; margin-left: 10px; }
  header.top a { font: 600 13px var(--xp-mono); color: var(--xp-ink); }
  .xp-stage, .xp-card-top { background: var(--xp-paper); }
</style>
<style>header.top{flex-wrap:wrap}header.top .home{flex-basis:100%;margin-bottom:8px;font:500 13px var(--xp-mono);color:var(--xp-muted);text-decoration:none;transition:color .2s}header.top .home:hover{color:var(--xp-ink)}</style>
</head>
<body>
<div class="page">
  <header class="top"><a class="home" href="http://localhost:8900/" title="Back to the shelf">← Shelf</a><h1>Lucky <span>a 74-second explainer</span></h1><a href="http://localhost:8905/">Run the simulation yourself →</a></header>
  <div id="explainer"></div>
</div>
<script>
  // an inked cursor: a green ink fill under a black pen line
  window.EXPLAINER_CURSOR = { fill: "#12a15a", line: "#1d1b18", texture: "ink", offset: [1.4, 1.2], tag: { bg: "#1d1b18", fg: "#f5f1e6", shadow: "#ffe25e", font: '600 12.5px "JetBrains Mono", monospace' } };
</script>
<script src="/kit/stage.js"></script>
<script src="/kit/answer.js"></script>
<script src="sim.js"></script>
<script src="style.js"></script>
<script src="scenes.js"></script>
<script src="/kit/player.js"></script>
<script src="/kit/cursor.js"></script>
</body>
</html>
